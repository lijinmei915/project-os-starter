[package]
name = "OmniDesk"
version = "0.1.0"
description = "OmniDesk local AI project workbench"
authors = ["Project OS"]
edition = "2021"
default-run = "OmniDesk"

[[bin]]
name = "OmniDesk"
path = "src/main.rs"

[[bin]]
name = "omnidesk-patch-normalizer"
path = "src/bin/patch_normalizer.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
portable-pty = "0.8"
notify = "6"
libc = "0.2"
base64 = "0.22"
tauri-plugin-wdio-webdriver = { version = "1.2.0", optional = true }

[features]
webdriver = ["dep:tauri-plugin-wdio-webdriver"]
