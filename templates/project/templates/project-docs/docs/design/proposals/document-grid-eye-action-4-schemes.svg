<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#171c1d" flood-opacity="0.08"/>
    </filter>
    <g id="eyeIcon" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/>
      <circle cx="12" cy="12" r="3"/>
    </g>
    <g id="checkIcon" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 12.2l4 4L18.5 7.5"/>
    </g>
  </defs>

  <rect width="1800" height="1180" fill="#f8fafa"/>

  <g transform="translate(92 70)">
    <rect x="0" y="0" width="304" height="54" rx="8" fill="#171c1d"/>
    <path d="M35 17l4 11 11 4-11 4-4 11-4-11-11-4 11-4 4-11z" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="70" y="36" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#fff" letter-spacing="1.5">AI ENGINEERING KIT</text>
    <text x="0" y="136" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="54" font-weight="800" fill="#171c1d">文档卡片查看入口方案</text>
    <text x="0" y="185" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="500" fill="#6d7578">目标：眼睛查看不单独占一行，和标题、路径、状态融进同一个文档卡组件。</text>
  </g>

  <!-- Scheme 01 -->
  <g transform="translate(92 310)">
    <rect x="0" y="0" width="780" height="350" rx="28" fill="#ffffff" stroke="#d6dddc" stroke-width="2" filter="url(#softShadow)"/>
    <circle cx="58" cy="58" r="22" fill="#f2f5f5"/>
    <text x="58" y="67" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#4f5658">1</text>
    <text x="92" y="67" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#171c1d">右上角图标按钮</text>
    <text x="92" y="107" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" fill="#6d7578">最轻，保留当前卡片密度，推荐优先试这个。</text>

    <g transform="translate(70 150)">
      <rect x="0" y="0" width="640" height="126" rx="18" fill="#fff" stroke="#171c1d" stroke-width="3"/>
      <rect x="28" y="30" width="28" height="28" rx="6" fill="#171c1d"/>
      <g transform="translate(30 32)" color="#34d399"><use href="#checkIcon"/></g>
      <text x="78" y="44" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="27" font-weight="800" fill="#171c1d">项目说明</text>
      <text x="78" y="79" font-family="SFMono-Regular,Consolas,monospace" font-size="19" fill="#9da4a5">PROJECT.md</text>
      <text x="78" y="108" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" fill="#6d7578">这个项目是什么，给谁用，目标是什么</text>
      <rect x="574" y="24" width="42" height="42" rx="12" fill="#f2f5f5" stroke="#e1e5e5"/>
      <g transform="translate(583 33)" color="#4f5658"><use href="#eyeIcon"/></g>
    </g>
  </g>

  <!-- Scheme 02 -->
  <g transform="translate(928 310)">
    <rect x="0" y="0" width="780" height="350" rx="28" fill="#ffffff" stroke="#d6dddc" stroke-width="2" filter="url(#softShadow)"/>
    <circle cx="58" cy="58" r="22" fill="#f2f5f5"/>
    <text x="58" y="67" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#4f5658">2</text>
    <text x="92" y="67" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#171c1d">标题行文字按钮</text>
    <text x="92" y="107" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" fill="#6d7578">“预览”更直白，适合不懂图标含义的用户。</text>

    <g transform="translate(70 150)">
      <rect x="0" y="0" width="640" height="126" rx="18" fill="#fff" stroke="#d6dddc" stroke-width="2"/>
      <rect x="28" y="30" width="28" height="28" rx="6" fill="#171c1d"/>
      <g transform="translate(30 32)" color="#34d399"><use href="#checkIcon"/></g>
      <text x="78" y="44" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="27" font-weight="800" fill="#171c1d">AI 工作规则</text>
      <g transform="translate(484 19)">
        <rect x="0" y="0" width="118" height="46" rx="23" fill="#f8fafa" stroke="#d6dddc"/>
        <g transform="translate(18 11)" color="#087b73"><use href="#eyeIcon"/></g>
        <text x="52" y="30" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#087b73">预览</text>
      </g>
      <text x="78" y="80" font-family="SFMono-Regular,Consolas,monospace" font-size="19" fill="#9da4a5">AGENTS.md</text>
      <text x="78" y="109" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" fill="#6d7578">AI 该怎么做，哪些事不要乱改</text>
    </g>
  </g>

  <!-- Scheme 03 -->
  <g transform="translate(92 730)">
    <rect x="0" y="0" width="780" height="350" rx="28" fill="#ffffff" stroke="#d6dddc" stroke-width="2" filter="url(#softShadow)"/>
    <circle cx="58" cy="58" r="22" fill="#f2f5f5"/>
    <text x="58" y="67" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#4f5658">3</text>
    <text x="92" y="67" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#171c1d">路径后内联查看</text>
    <text x="92" y="107" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" fill="#6d7578">查看动作跟文件路径绑定，语义最清楚。</text>

    <g transform="translate(70 150)">
      <rect x="0" y="0" width="640" height="126" rx="18" fill="#fff" stroke="#d6dddc" stroke-width="2"/>
      <rect x="28" y="30" width="28" height="28" rx="6" fill="#171c1d"/>
      <g transform="translate(30 32)" color="#34d399"><use href="#checkIcon"/></g>
      <text x="78" y="44" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="27" font-weight="800" fill="#171c1d">当前状态</text>
      <text x="78" y="80" font-family="SFMono-Regular,Consolas,monospace" font-size="19" fill="#9da4a5">HANDOFF.md</text>
      <rect x="210" y="54" width="36" height="36" rx="10" fill="#ffffff" stroke="#d6dddc"/>
      <g transform="translate(216 60)" color="#087b73"><use href="#eyeIcon"/></g>
      <text x="78" y="109" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" fill="#6d7578">现在做到哪一步，还缺什么</text>
    </g>
  </g>

  <!-- Scheme 04 -->
  <g transform="translate(928 730)">
    <rect x="0" y="0" width="780" height="350" rx="28" fill="#ffffff" stroke="#d6dddc" stroke-width="2" filter="url(#softShadow)"/>
    <circle cx="58" cy="58" r="22" fill="#f2f5f5"/>
    <text x="58" y="67" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#4f5658">4</text>
    <text x="92" y="67" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#171c1d">右侧操作槽</text>
    <text x="92" y="107" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" fill="#6d7578">适合以后扩展更多操作，比如复制、下载、打开。</text>

    <g transform="translate(70 150)">
      <rect x="0" y="0" width="640" height="126" rx="18" fill="#fff" stroke="#d6dddc" stroke-width="2"/>
      <rect x="28" y="30" width="28" height="28" rx="6" fill="#171c1d"/>
      <g transform="translate(30 32)" color="#34d399"><use href="#checkIcon"/></g>
      <text x="78" y="44" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="27" font-weight="800" fill="#171c1d">设计规范</text>
      <text x="78" y="80" font-family="SFMono-Regular,Consolas,monospace" font-size="19" fill="#9da4a5">docs/DESIGN_STANDARDS.md</text>
      <text x="78" y="109" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" fill="#6d7578">界面、组件、视觉边界</text>
      <line x1="548" y1="22" x2="548" y2="104" stroke="#e1e5e5"/>
      <rect x="566" y="42" width="44" height="44" rx="14" fill="#171c1d"/>
      <g transform="translate(576 52)" color="#34d399"><use href="#eyeIcon"/></g>
    </g>
  </g>

  <g transform="translate(92 1115)">
    <rect x="0" y="-36" width="1616" height="2" fill="#e1e5e5"/>
    <text x="0" y="0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#171c1d">我的建议：</text>
    <text x="118" y="0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" fill="#4f5658">先选 1。它最克制、最像当前 UI，不增加文案噪音；如果担心用户不懂眼睛，再选 2。</text>
  </g>
</svg>
