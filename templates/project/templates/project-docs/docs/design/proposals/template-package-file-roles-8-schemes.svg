<svg width="2800" height="2060" viewBox="0 0 2800 2060" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .panel { fill: #ffffff; stroke: #e4e4e7; stroke-width: 2; }
      .panel-soft { fill: #f8fafc; stroke: #e4e4e7; stroke-width: 2; }
      .ink { fill: #18181b; }
      .muted { fill: #71717a; }
      .weak { fill: #a1a1aa; }
      .brand { fill: #13b7a6; }
      .brand-stroke { stroke: #13b7a6; }
      .line { stroke: #d4d4d8; stroke-width: 3; }
      .dash { stroke: #d4d4d8; stroke-width: 3; stroke-dasharray: 10 10; }
      .arrow { stroke: #13b7a6; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .title { font: 800 54px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .subtitle { font: 650 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .panel-title { font: 800 31px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .panel-note { font: 500 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .label { font: 750 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .small { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .mono { font: 650 16px "SFMono-Regular", Consolas, monospace; letter-spacing: 0; }
      .num { font: 800 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#13b7a6"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#18181b" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect class="bg" width="2800" height="2060"/>

  <g transform="translate(100 72)">
    <rect x="0" y="0" width="338" height="60" rx="12" fill="#18181b"/>
    <path d="M42 30h38M61 11v38M52 21l-10-10M70 21l10-10M52 39l-10 10M70 39l10 10" stroke="#13b7a6" stroke-width="4" stroke-linecap="round"/>
    <text x="102" y="40" class="subtitle" fill="#ffffff">AI Engineering Kit</text>
    <text x="0" y="152" class="title ink">三种模板包里的文件是干嘛的 · 8 个解释方案</text>
    <text x="0" y="202" class="subtitle muted">core 是最小接手包；product 是工程文档包；full 是完整 AI 工具适配包。</text>
  </g>

  <!-- 01 Layered packages -->
  <g transform="translate(100 330)">
    <rect class="panel" width="620" height="390" rx="28" filter="url(#softShadow)"/>
    <circle cx="48" cy="48" r="22" fill="#f4f4f5"/>
    <text x="38" y="56" class="num muted">01</text>
    <text x="88" y="58" class="panel-title ink">三层包关系</text>
    <text x="88" y="94" class="panel-note muted">不是三个独立产品，是一层层加能力</text>

    <rect x="90" y="284" width="440" height="54" rx="14" fill="#18181b"/>
    <text x="132" y="319" class="label" fill="#ffffff">full：product + 设计规范 + AI 工具适配</text>
    <rect x="132" y="214" width="356" height="54" rx="14" fill="#f8fafc" stroke="#d4d4d8" stroke-width="2"/>
    <text x="164" y="249" class="label ink">product：core + 工程文档</text>
    <rect x="174" y="144" width="272" height="54" rx="14" fill="#ecfdf5" stroke="#13b7a6" stroke-width="2"/>
    <text x="218" y="179" class="label ink">core：最小接手</text>
    <text x="148" y="368" class="small muted">看不懂选 core；要规范选 product；要跨工具选 full</text>
  </g>

  <!-- 02 Core contents -->
  <g transform="translate(760 330)">
    <rect class="panel" width="620" height="390" rx="28" filter="url(#softShadow)"/>
    <circle cx="48" cy="48" r="22" fill="#f4f4f5"/>
    <text x="39" y="56" class="num muted">02</text>
    <text x="88" y="58" class="panel-title ink">core-template</text>
    <text x="88" y="94" class="panel-note muted">AI 接手项目最少要有这些</text>

    <g transform="translate(68 130)">
      <rect width="220" height="64" rx="14" fill="#18181b"/>
      <text x="24" y="31" class="mono" fill="#ffffff">AGENTS.md</text>
      <text x="24" y="52" class="small" fill="#d4d4d8">AI 怎么干活</text>
    </g>
    <g transform="translate(332 130)">
      <rect width="220" height="64" rx="14" fill="#ecfdf5" stroke="#13b7a6" stroke-width="2"/>
      <text x="24" y="31" class="mono ink">PROJECT.md</text>
      <text x="24" y="52" class="small muted">当前项目状态</text>
    </g>
    <g transform="translate(68 214)">
      <rect width="220" height="64" rx="14" fill="#f8fafc" stroke="#e4e4e7" stroke-width="2"/>
      <text x="24" y="31" class="mono ink">HANDOFF.md</text>
      <text x="24" y="52" class="small muted">下一位怎么接</text>
    </g>
    <g transform="translate(332 214)">
      <rect width="220" height="64" rx="14" fill="#f8fafc" stroke="#e4e4e7" stroke-width="2"/>
      <text x="24" y="31" class="mono ink">.env.example</text>
      <text x="24" y="52" class="small muted">本地变量占位</text>
    </g>
    <text x="82" y="332" class="small muted">一句话：core 让 AI 先“知道规则、知道状态、知道下一步”。</text>
  </g>

  <!-- 03 Scripts -->
  <g transform="translate(1420 330)">
    <rect class="panel" width="620" height="390" rx="28" filter="url(#softShadow)"/>
    <circle cx="48" cy="48" r="22" fill="#f4f4f5"/>
    <text x="39" y="56" class="num muted">03</text>
    <text x="88" y="58" class="panel-title ink">scripts 目录</text>
    <text x="88" y="94" class="panel-note muted">这些是“会干活”的命令</text>

    <g transform="translate(64 128)">
      <rect width="492" height="42" rx="10" fill="#ecfdf5" stroke="#13b7a6" stroke-width="2"/>
      <text x="20" y="27" class="mono ink">check-runtime.sh</text>
      <text x="286" y="27" class="small muted">检查结构齐不齐</text>
    </g>
    <g transform="translate(64 182)">
      <rect width="492" height="42" rx="10" fill="#f8fafc" stroke="#e4e4e7" stroke-width="2"/>
      <text x="20" y="27" class="mono ink">check-ai-project.sh</text>
      <text x="286" y="27" class="small muted">生成完整度报告</text>
    </g>
    <g transform="translate(64 236)">
      <rect width="492" height="42" rx="10" fill="#f8fafc" stroke="#e4e4e7" stroke-width="2"/>
      <text x="20" y="27" class="mono ink">ai-project.sh</text>
      <text x="286" y="27" class="small muted">简化命令入口</text>
    </g>
    <g transform="translate(64 290)">
      <rect width="492" height="42" rx="10" fill="#f8fafc" stroke="#e4e4e7" stroke-width="2"/>
      <text x="20" y="27" class="mono ink">add-project-docs.sh</text>
      <text x="286" y="27" class="small muted">后续补文档</text>
    </g>
    <text x="84" y="360" class="small muted">另有 check-secrets.sh：检查 key 有没有被误提交。</text>
  </g>

  <!-- 04 Data and templates -->
  <g transform="translate(2080 330)">
    <rect class="panel" width="620" height="390" rx="28" filter="url(#softShadow)"/>
    <circle cx="48" cy="48" r="22" fill="#f4f4f5"/>
    <text x="38" y="56" class="num muted">04</text>
    <text x="88" y="58" class="panel-title ink">schemas / templates</text>
    <text x="88" y="94" class="panel-note muted">这些让报告可解释、可复用</text>

    <rect x="70" y="148" width="150" height="70" rx="16" fill="#ecfdf5" stroke="#13b7a6" stroke-width="2"/>
    <text x="98" y="178" class="label ink">schemas</text>
    <text x="94" y="202" class="small muted">评分/报告标准</text>
    <path class="arrow" d="M230 183H306" marker-end="url(#arrow)"/>
    <rect x="318" y="148" width="150" height="70" rx="16" fill="#f8fafc" stroke="#e4e4e7" stroke-width="2"/>
    <text x="348" y="178" class="label ink">scripts</text>
    <text x="348" y="202" class="small muted">读取并计算</text>
    <path class="arrow" d="M393 228V270" marker-end="url(#arrow)"/>
    <rect x="222" y="284" width="176" height="52" rx="14" fill="#18181b"/>
    <text x="250" y="317" class="label" fill="#ffffff">HTML 报告</text>
    <rect x="420" y="284" width="120" height="52" rx="14" fill="#f8fafc" stroke="#e4e4e7" stroke-width="2"/>
    <text x="448" y="317" class="label ink">JSON</text>
    <text x="86" y="360" class="small muted">templates/report 是页面壳；templates/project-docs 是后续补文档模板库。</text>
  </g>

  <!-- 05 Product docs -->
  <g transform="translate(100 760)">
    <rect class="panel" width="620" height="390" rx="28" filter="url(#softShadow)"/>
    <circle cx="48" cy="48" r="22" fill="#f4f4f5"/>
    <text x="39" y="56" class="num muted">05</text>
    <text x="88" y="58" class="panel-title ink">product-template</text>
    <text x="88" y="94" class="panel-note muted">把“项目怎么维护”说清楚</text>

    <g transform="translate(58 128)">
      <rect width="504" height="212" rx="20" fill="#f8fafc" stroke="#e4e4e7" stroke-width="2"/>
      <text x="28" y="44" class="mono ink">README.md / INSTALL.md</text>
      <text x="322" y="44" class="small muted">给人入口</text>
      <line x1="28" y1="68" x2="476" y2="68" class="line"/>
      <text x="28" y="104" class="mono ink">DOCUMENTATION / NAMING</text>
      <text x="322" y="104" class="small muted">文档怎么写</text>
      <text x="28" y="146" class="mono ink">ARCHITECTURE / ENVIRONMENT</text>
      <text x="322" y="146" class="small muted">项目怎么跑</text>
      <text x="28" y="188" class="mono ink">TESTING / RUNBOOK</text>
      <text x="322" y="188" class="small muted">怎么验收维护</text>
    </g>
    <text x="76" y="362" class="small muted">CHANGELOG / DECISIONS / LESSONS 负责记录变化、原因和踩坑。</text>
  </g>

  <!-- 06 Full additions -->
  <g transform="translate(760 760)">
    <rect class="panel" width="620" height="390" rx="28" filter="url(#softShadow)"/>
    <circle cx="48" cy="48" r="22" fill="#f4f4f5"/>
    <text x="38" y="56" class="num muted">06</text>
    <text x="88" y="58" class="panel-title ink">full-template</text>
    <text x="88" y="94" class="panel-note muted">完整 runtime，不建议所有项目默认上</text>

    <rect x="72" y="132" width="210" height="74" rx="16" fill="#ecfdf5" stroke="#13b7a6" stroke-width="2"/>
    <text x="104" y="164" class="mono ink">docs/design</text>
    <text x="104" y="188" class="small muted">tokens / layout / 组件</text>
    <rect x="338" y="132" width="210" height="74" rx="16" fill="#f8fafc" stroke="#e4e4e7" stroke-width="2"/>
    <text x="370" y="164" class="mono ink">.claude</text>
    <text x="370" y="188" class="small muted">skills / commands / hooks</text>
    <rect x="72" y="238" width="210" height="74" rx="16" fill="#f8fafc" stroke="#e4e4e7" stroke-width="2"/>
    <text x="104" y="270" class="mono ink">adapters</text>
    <text x="104" y="294" class="small muted">Codex / Cursor / Gemini</text>
    <rect x="338" y="238" width="210" height="74" rx="16" fill="#18181b"/>
    <text x="370" y="270" class="mono" fill="#ffffff">install-adapter</text>
    <text x="370" y="294" class="small" fill="#d4d4d8">安装工具入口</text>
    <text x="98" y="360" class="small muted">full 是“参考实现 + 跨工具适配”，体量最大。</text>
  </g>

  <!-- 07 What users should open -->
  <g transform="translate(1420 760)">
    <rect class="panel" width="620" height="390" rx="28" filter="url(#softShadow)"/>
    <circle cx="48" cy="48" r="22" fill="#f4f4f5"/>
    <text x="39" y="56" class="num muted">07</text>
    <text x="88" y="58" class="panel-title ink">用户先看什么</text>
    <text x="88" y="94" class="panel-note muted">解压后别从脚本开始看</text>

    <g transform="translate(82 128)">
      <rect width="456" height="52" rx="14" fill="#18181b"/>
      <text x="28" y="34" class="label" fill="#ffffff">1. README.md：这个包怎么用</text>
    </g>
    <g transform="translate(82 196)">
      <rect width="456" height="52" rx="14" fill="#ecfdf5" stroke="#13b7a6" stroke-width="2"/>
      <text x="28" y="34" class="label ink">2. AGENTS.md：AI 该怎么工作</text>
    </g>
    <g transform="translate(82 264)">
      <rect width="456" height="52" rx="14" fill="#f8fafc" stroke="#e4e4e7" stroke-width="2"/>
      <text x="28" y="34" class="label ink">3. scripts/ai-project.sh report</text>
    </g>
    <text x="96" y="358" class="small muted">core 里没有 README 时，就先看 AGENTS / PROJECT / HANDOFF。</text>
  </g>

  <!-- 08 Safety and boundaries -->
  <g transform="translate(2080 760)">
    <rect class="panel" width="620" height="390" rx="28" filter="url(#softShadow)"/>
    <circle cx="48" cy="48" r="22" fill="#f4f4f5"/>
    <text x="38" y="56" class="num muted">08</text>
    <text x="88" y="58" class="panel-title ink">哪些不是业务代码</text>
    <text x="88" y="94" class="panel-note muted">它们是规范、检查器和说明书</text>

    <rect x="78" y="130" width="464" height="58" rx="14" fill="#ecfdf5" stroke="#13b7a6" stroke-width="2"/>
    <text x="106" y="167" class="label ink">不会替你写业务功能</text>
    <rect x="78" y="204" width="464" height="58" rx="14" fill="#f8fafc" stroke="#e4e4e7" stroke-width="2"/>
    <text x="106" y="241" class="label ink">不会把真实 API key 放进包</text>
    <rect x="78" y="278" width="464" height="58" rx="14" fill="#18181b"/>
    <text x="106" y="315" class="label" fill="#ffffff">不会覆盖已有文档，默认跳过冲突</text>
    <text x="92" y="366" class="small muted">真正业务需求仍由用户和 AI 在项目里继续生成。</text>
  </g>

  <!-- Bottom summary -->
  <g transform="translate(100 1232)">
    <rect class="panel-soft" width="2600" height="650" rx="34"/>
    <text x="54" y="72" class="panel-title ink">一眼看懂：三个包分别解决什么问题</text>
    <text x="54" y="112" class="panel-note muted">如果要给别人解释，可以直接用下面这个三列表述：先选包，再看文件组，最后跑检查。</text>

    <g transform="translate(54 166)">
      <rect width="760" height="400" rx="26" fill="#ffffff" stroke="#13b7a6" stroke-width="4"/>
      <rect x="28" y="28" width="138" height="48" rx="12" fill="#ecfdf5" stroke="#13b7a6" stroke-width="2"/>
      <text x="58" y="60" class="label ink">core</text>
      <text x="28" y="112" class="panel-title ink">最小接手包</text>
      <text x="28" y="154" class="panel-note muted">让 AI 马上知道怎么继续</text>
      <text x="28" y="210" class="mono ink">AGENTS.md</text>
      <text x="280" y="210" class="small muted">AI 规则</text>
      <text x="28" y="252" class="mono ink">PROJECT.md / HANDOFF.md</text>
      <text x="280" y="252" class="small muted">状态和交接</text>
      <text x="28" y="294" class="mono ink">scripts + schemas + report</text>
      <text x="280" y="294" class="small muted">检查和报告</text>
      <text x="28" y="344" class="small muted">适合：先轻量接入，不想引入一堆文档的人。</text>
    </g>

    <g transform="translate(920 166)">
      <rect width="760" height="400" rx="26" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
      <rect x="28" y="28" width="174" height="48" rx="12" fill="#f8fafc" stroke="#d4d4d8" stroke-width="2"/>
      <text x="58" y="60" class="label ink">product</text>
      <text x="28" y="112" class="panel-title ink">工程文档包</text>
      <text x="28" y="154" class="panel-note muted">让项目可维护、可交接、可复盘</text>
      <text x="28" y="210" class="mono ink">README / INSTALL</text>
      <text x="280" y="210" class="small muted">人类入口</text>
      <text x="28" y="252" class="mono ink">ARCHITECTURE / ENVIRONMENT</text>
      <text x="280" y="252" class="small muted">工程运行</text>
      <text x="28" y="294" class="mono ink">TESTING / RUNBOOK / DECISIONS</text>
      <text x="280" y="294" class="small muted">验收和决策</text>
      <text x="28" y="344" class="small muted">适合：认真做产品、工具、长期维护项目。</text>
    </g>

    <g transform="translate(1786 166)">
      <rect width="760" height="400" rx="26" fill="#ffffff" stroke="#18181b" stroke-width="4"/>
      <rect x="28" y="28" width="118" height="48" rx="12" fill="#18181b"/>
      <text x="58" y="60" class="label" fill="#ffffff">full</text>
      <text x="28" y="112" class="panel-title ink">完整 runtime 包</text>
      <text x="28" y="154" class="panel-note muted">让 Claude / Codex / Cursor / Gemini 都能接</text>
      <text x="28" y="210" class="mono ink">docs/design</text>
      <text x="280" y="210" class="small muted">设计规范和组件</text>
      <text x="28" y="252" class="mono ink">.claude</text>
      <text x="280" y="252" class="small muted">Claude 参考实现</text>
      <text x="28" y="294" class="mono ink">adapters / install-adapter</text>
      <text x="280" y="294" class="small muted">跨工具入口</text>
      <text x="28" y="344" class="small muted">适合：要验证完整 Project OS 能力的人。</text>
    </g>
  </g>
</svg>
