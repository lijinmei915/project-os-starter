<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1800" viewBox="0 0 2400 1800">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#18181b" flood-opacity=".10"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#18181b" flood-opacity=".08"/>
    </filter>
    <style>
      .bg { fill: #f7f8fa; }
      .sheet { fill: #ffffff; stroke: #e4e4e7; stroke-width: 1.5; }
      .panel { fill: #ffffff; stroke: #e7e8ec; stroke-width: 1.5; }
      .panel-soft { fill: #fbfbfc; stroke: #eceef2; stroke-width: 1.5; }
      .ink { fill: #18181b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #71717a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .weak { fill: #a1a1aa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 28px; font-weight: 800; }
      .subtitle { font-size: 17px; font-weight: 520; }
      .label { font-size: 22px; font-weight: 760; }
      .small { font-size: 16px; font-weight: 600; }
      .desc { font-size: 18px; font-weight: 520; }
      .note { font-size: 15px; font-weight: 520; }
      .brand { fill: #10b981; }
      .brand-dark { fill: #047857; }
      .brand-stroke { stroke: #10b981; }
      .gray-stroke { stroke: #a1a1aa; }
      .blue { fill: #2563eb; }
      .blue-stroke { stroke: #2563eb; }
      .amber { fill: #d97706; }
      .amber-stroke { stroke: #d97706; }
      .dark { fill: #18181b; }
      .line { stroke-linecap: round; stroke-linejoin: round; fill: none; stroke-width: 4; }
      .thin { stroke-linecap: round; stroke-linejoin: round; fill: none; stroke-width: 3; }
      .dash { stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect class="bg" width="2400" height="1800"/>

  <g transform="translate(90 70)">
    <text class="ink" x="0" y="0" font-size="46" font-weight="850">协作模式选择器 · 8 个优化方向</text>
    <text class="muted" x="0" y="44" font-size="22" font-weight="560">目标：让不懂代码的人一眼知道“我该选哪个”、当前选中了什么、选项会影响什么。</text>
    <g transform="translate(1680 -24)">
      <rect x="0" y="0" width="520" height="72" rx="18" fill="#18181b"/>
      <text x="34" y="45" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="800">OptionCard / choice 变体探索</text>
      <circle cx="462" cy="36" r="15" fill="none" stroke="#34d399" stroke-width="4"/>
      <path d="M455 36 L461 42 L472 29" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Card 1 -->
  <g transform="translate(90 170)" filter="url(#softShadow)">
    <rect class="panel" x="0" y="0" width="520" height="355" rx="24"/>
    <text class="title ink" x="30" y="48">01 当前增强版</text>
    <text class="subtitle muted" x="30" y="78">保留现有形态，强化选中反馈</text>
    <g transform="translate(30 116)">
      <rect x="0" y="0" width="208" height="74" rx="20" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
      <circle cx="34" cy="27" r="10" fill="none" stroke="#059669" stroke-width="4"/>
      <path d="M18 57 C23 43 45 43 50 57" class="thin" stroke="#059669"/>
      <text class="label" x="70" y="47" fill="#047857">个人开发</text>
      <circle cx="184" cy="20" r="13" fill="#10b981"/>
      <path d="M178 20 L183 25 L191 15" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(260 116)">
      <rect x="0" y="0" width="220" height="74" rx="20" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
      <circle cx="31" cy="30" r="9" fill="none" stroke="#a1a1aa" stroke-width="4"/>
      <path d="M16 59 C22 45 40 45 47 59" class="thin" stroke="#a1a1aa"/>
      <circle cx="55" cy="30" r="8" fill="none" stroke="#a1a1aa" stroke-width="3"/>
      <path d="M49 57 C54 47 66 47 71 57" class="thin" stroke="#a1a1aa"/>
      <text class="label muted" x="86" y="47">团队协作</text>
    </g>
    <rect x="30" y="220" width="460" height="72" rx="18" fill="#f7f8fa"/>
    <text class="desc muted" x="54" y="250">AI 提供敏捷上下文，重视开发速度与灵活性。</text>
    <text class="note weak" x="54" y="278">交互：选中卡出现勾选角标，说明跟随选中项变化。</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(660 170)" filter="url(#softShadow)">
    <rect class="panel" x="0" y="0" width="520" height="355" rx="24"/>
    <text class="title ink" x="30" y="48">02 分段滑块</text>
    <text class="subtitle muted" x="30" y="78">像系统设置一样，低学习成本</text>
    <g transform="translate(30 120)">
      <rect x="0" y="0" width="460" height="84" rx="24" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="2"/>
      <rect x="8" y="8" width="220" height="68" rx="20" fill="#18181b"/>
      <path d="M54 28 a12 12 0 1 0 0.1 0 M34 64 C40 49 63 49 69 64" class="thin" stroke="#34d399"/>
      <text x="88" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="800">个人开发</text>
      <path d="M273 29 a10 10 0 1 0 .1 0 M257 62 C262 51 279 51 284 62 M296 31 a8 8 0 1 0 .1 0 M290 61 C294 52 306 52 310 61" class="thin" stroke="#71717a"/>
      <text class="label muted" x="326" y="52">团队协作</text>
    </g>
    <g transform="translate(30 232)">
      <circle cx="14" cy="14" r="14" fill="#10b981"/>
      <path d="M8 14 L13 19 L22 9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="desc muted" x="40" y="20">当前将生成轻量规则和交接文档，适合一个人快速启动。</text>
      <text class="note weak" x="40" y="50">交互：点击右侧滑块移动，说明文字自动切换。</text>
    </g>
  </g>

  <!-- Card 3 -->
  <g transform="translate(1230 170)" filter="url(#softShadow)">
    <rect class="panel" x="0" y="0" width="520" height="355" rx="24"/>
    <text class="title ink" x="30" y="48">03 问答选择</text>
    <text class="subtitle muted" x="30" y="78">用自然语言降低理解门槛</text>
    <text class="small muted" x="32" y="122">你现在是哪种工作方式？</text>
    <g transform="translate(30 146)">
      <rect x="0" y="0" width="460" height="72" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
      <circle cx="34" cy="36" r="14" fill="#10b981"/>
      <circle cx="34" cy="36" r="6" fill="#ffffff"/>
      <text class="label" x="66" y="43" fill="#047857">我自己做，先跑起来</text>
    </g>
    <g transform="translate(30 230)">
      <rect x="0" y="0" width="460" height="64" rx="18" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
      <circle cx="34" cy="32" r="13" fill="#ffffff" stroke="#d4d4d8" stroke-width="3"/>
      <text class="label muted" x="66" y="40">多人协作，要先统一规则</text>
    </g>
    <text class="note weak" x="30" y="323">交互：文案从“开发模式”改成用户能回答的问题。</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(1790 170)" filter="url(#softShadow)">
    <rect class="panel-soft" x="0" y="0" width="520" height="355" rx="24"/>
    <text class="title ink" x="30" y="48">04 状态预览</text>
    <text class="subtitle muted" x="30" y="78">选择时直接看到会生成什么</text>
    <g transform="translate(30 112)">
      <rect x="0" y="0" width="220" height="130" rx="22" fill="#18181b"/>
      <path d="M39 28 a12 12 0 1 0 .1 0 M20 65 C26 50 52 50 58 65" class="thin" stroke="#34d399"/>
      <text x="78" y="45" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="800">个人开发</text>
      <text x="78" y="78" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="560">AGENTS / PROJECT / HANDOFF</text>
      <circle cx="190" cy="32" r="13" fill="none" stroke="#34d399" stroke-width="4"/>
      <path d="M184 32 L190 38 L198 24" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(270 112)">
      <rect x="0" y="0" width="220" height="130" rx="22" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
      <path d="M32 31 a10 10 0 1 0 .1 0 M17 64 C22 52 41 52 47 64 M57 33 a8 8 0 1 0 .1 0 M51 63 C55 54 66 54 70 63" class="thin" stroke="#a1a1aa"/>
      <text class="label muted" x="84" y="46">团队协作</text>
      <text class="note weak" x="84" y="78">DECISIONS / CHANGELOG</text>
    </g>
    <rect x="30" y="270" width="460" height="42" rx="14" fill="#edf7f5"/>
    <text class="note" x="52" y="297" fill="#047857" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="700">交互：卡片里提示产物，用户知道这个选择会影响哪里。</text>
  </g>

  <!-- Card 5 -->
  <g transform="translate(90 575)" filter="url(#softShadow)">
    <rect class="panel" x="0" y="0" width="520" height="355" rx="24"/>
    <text class="title ink" x="30" y="48">05 图标胶囊</text>
    <text class="subtitle muted" x="30" y="78">更轻、更像工具栏，适合紧凑布局</text>
    <g transform="translate(30 128)">
      <rect x="0" y="0" width="460" height="86" rx="43" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
      <rect x="8" y="8" width="220" height="70" rx="35" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <circle cx="48" cy="43" r="22" fill="#10b981"/>
      <path d="M48 31 a8 8 0 1 0 .1 0 M34 59 C39 48 57 48 62 59" class="thin" stroke="#fff"/>
      <text class="label" x="84" y="51" fill="#047857">个人开发</text>
      <circle cx="276" cy="43" r="22" fill="#f4f4f5"/>
      <path d="M270 36 a7 7 0 1 0 .1 0 M258 57 C263 49 276 49 281 57 M287 37 a6 6 0 1 0 .1 0 M283 56 C286 50 295 50 298 56" class="thin" stroke="#a1a1aa"/>
      <text class="label muted" x="314" y="51">团队协作</text>
    </g>
    <text class="desc muted" x="30" y="254">个人开发：更少文档、更快启动，后续可升级为团队协作。</text>
    <text class="note weak" x="30" y="288">交互：hover 只改变胶囊背景，不改变按钮尺寸。</text>
  </g>

  <!-- Card 6 -->
  <g transform="translate(660 575)" filter="url(#softShadow)">
    <rect class="panel" x="0" y="0" width="520" height="355" rx="24"/>
    <text class="title ink" x="30" y="48">06 双列解释卡</text>
    <text class="subtitle muted" x="30" y="78">适合首次使用，需要解释差异</text>
    <g transform="translate(30 112)">
      <rect x="0" y="0" width="220" height="168" rx="22" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
      <text class="label" x="26" y="45" fill="#047857">个人开发</text>
      <text class="desc muted" x="26" y="82">快速原型</text>
      <text class="desc muted" x="26" y="112">少量治理</text>
      <text class="desc muted" x="26" y="142">灵活调整</text>
      <circle cx="188" cy="36" r="14" fill="#10b981"/>
      <path d="M181 36 L187 42 L197 29" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(270 112)">
      <rect x="0" y="0" width="220" height="168" rx="22" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
      <text class="label muted" x="26" y="45">团队协作</text>
      <text class="desc muted" x="26" y="82">规则更细</text>
      <text class="desc muted" x="26" y="112">交接更稳</text>
      <text class="desc muted" x="26" y="142">决策可追溯</text>
    </g>
    <text class="note weak" x="30" y="318">交互：适合新手，代价是占用高度更多。</text>
  </g>

  <!-- Card 7 -->
  <g transform="translate(1230 575)" filter="url(#softShadow)">
    <rect class="panel-soft" x="0" y="0" width="520" height="355" rx="24"/>
    <text class="title ink" x="30" y="48">07 推荐优先</text>
    <text class="subtitle muted" x="30" y="78">默认推荐一个，另一个作为可切换</text>
    <g transform="translate(30 120)">
      <rect x="0" y="0" width="460" height="92" rx="24" fill="#18181b"/>
      <rect x="24" y="24" width="74" height="44" rx="22" fill="#064e3b"/>
      <text x="43" y="53" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="900">推荐</text>
      <text x="122" y="43" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="850">个人开发</text>
      <text x="122" y="69" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="560">适合刚开始、不确定需求、先让 AI 接住上下文</text>
      <circle cx="424" cy="46" r="15" fill="none" stroke="#34d399" stroke-width="4"/>
      <path d="M417 46 L423 52 L433 38" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(30 230)">
      <rect x="0" y="0" width="460" height="58" rx="18" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
      <text class="small muted" x="28" y="37">团队协作：多人维护、要审批或要记录决策时再切换</text>
    </g>
    <text class="note weak" x="30" y="322">交互：先给默认答案，减少选择压力。</text>
  </g>

  <!-- Card 8 -->
  <g transform="translate(1790 575)" filter="url(#softShadow)">
    <rect class="panel" x="0" y="0" width="520" height="355" rx="24"/>
    <text class="title ink" x="30" y="48">08 阶段式开关</text>
    <text class="subtitle muted" x="30" y="78">把选择表达成“成熟度阶段”</text>
    <g transform="translate(50 132)">
      <line x1="30" y1="42" x2="390" y2="42" stroke="#e4e4e7" stroke-width="8" stroke-linecap="round"/>
      <line x1="30" y1="42" x2="174" y2="42" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
      <circle cx="30" cy="42" r="25" fill="#10b981"/>
      <path d="M18 43 L27 52 L43 32" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="210" cy="42" r="22" fill="#ffffff" stroke="#d4d4d8" stroke-width="4"/>
      <circle cx="390" cy="42" r="22" fill="#ffffff" stroke="#d4d4d8" stroke-width="4"/>
      <text class="small" x="-2" y="94" fill="#047857">个人</text>
      <text class="small muted" x="177" y="94">团队</text>
      <text class="small muted" x="348" y="94">组织</text>
    </g>
    <rect x="30" y="260" width="460" height="46" rx="16" fill="#f8fafc"/>
    <text class="note muted" x="54" y="289">交互：未来可扩展为 3 阶段，不只二选一。</text>
  </g>

  <!-- Bottom explanation -->
  <g transform="translate(90 1010)">
    <rect class="sheet" x="0" y="0" width="2220" height="650" rx="30" filter="url(#softShadow)"/>
    <text class="ink" x="42" y="58" font-size="32" font-weight="850">推荐落地判断</text>
    <text class="muted" x="42" y="96" font-size="20" font-weight="560">这 8 个方案不是同时上，而是按目标用户和页面密度选一个主方向。</text>

    <g transform="translate(42 142)">
      <rect x="0" y="0" width="515" height="180" rx="22" fill="#ecfdf5" stroke="#b7e7ca" stroke-width="2"/>
      <text class="label" x="28" y="44" fill="#047857">首推：07 推荐优先</text>
      <text class="desc muted" x="28" y="82">非技术用户最容易理解。系统先给默认答案，用户只在有明确团队协作需求时切换。</text>
      <text class="note weak" x="28" y="128">适合当前新项目入口：减少犹豫，保留可自定义。</text>
    </g>

    <g transform="translate(590 142)">
      <rect x="0" y="0" width="515" height="180" rx="22" fill="#f8fafc" stroke="#e4e4e7" stroke-width="2"/>
      <text class="label ink" x="28" y="44">稳妥：02 分段滑块</text>
      <text class="desc muted" x="28" y="82">最像成熟产品控件，低风险，适合直接替换当前双卡片。</text>
      <text class="note weak" x="28" y="128">如果想少改视觉，选它。</text>
    </g>

    <g transform="translate(1138 142)">
      <rect x="0" y="0" width="515" height="180" rx="22" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
      <text class="label" x="28" y="44" fill="#b45309">解释型：06 双列解释卡</text>
      <text class="desc muted" x="28" y="82">当用户经常问“个人和团队有什么区别”时，用它最清楚。</text>
      <text class="note weak" x="28" y="128">代价是高度更大，不适合特别紧凑的首屏。</text>
    </g>

    <g transform="translate(1686 142)">
      <rect x="0" y="0" width="492" height="180" rx="22" fill="#eef4ff" stroke="#bfdbfe" stroke-width="2"/>
      <text class="label" x="28" y="44" fill="#175cd3">扩展型：08 阶段式开关</text>
      <text class="desc muted" x="28" y="82">如果后续要加入“组织级治理”，它比二选一更有延展性。</text>
      <text class="note weak" x="28" y="128">适合 v2，不一定适合当前版本。</text>
    </g>

    <g transform="translate(42 380)">
      <text class="ink" x="0" y="0" font-size="24" font-weight="850">交互细节建议</text>
      <g transform="translate(0 34)">
        <circle cx="10" cy="10" r="10" fill="#10b981"/>
        <text class="desc muted" x="34" y="17">说明文字要跟随选中项变化，而不是固定一句泛说明。</text>
      </g>
      <g transform="translate(0 72)">
        <circle cx="10" cy="10" r="10" fill="#10b981"/>
        <text class="desc muted" x="34" y="17">选中态至少同时具备：背景 / 边框 / 勾选 / 文案语义中的两种以上。</text>
      </g>
      <g transform="translate(0 110)">
        <circle cx="10" cy="10" r="10" fill="#10b981"/>
        <text class="desc muted" x="34" y="17">不要把“团队协作”做得像禁用态；未选中应可点击，禁用才降低对比度。</text>
      </g>
      <g transform="translate(0 148)">
        <circle cx="10" cy="10" r="10" fill="#10b981"/>
        <text class="desc muted" x="34" y="17">移动端优先使用 02 / 05 / 07，避免双列说明卡挤压。</text>
      </g>
    </g>
  </g>
</svg>
