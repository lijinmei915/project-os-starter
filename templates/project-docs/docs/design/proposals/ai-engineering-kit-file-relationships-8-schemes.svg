      .ink { fill: #18181b; }
      .muted { fill: #71717a; }
      .weak { fill: #a1a1aa; }
      .brand { fill: #13b7a6; }
      .brand-stroke { stroke: #13b7a6; }
      .ink-stroke { stroke: #18181b; }
      .line { stroke: #d4d4d8; stroke-width: 3; }
