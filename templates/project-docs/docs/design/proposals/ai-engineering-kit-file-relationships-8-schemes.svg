      .small { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .mono { font: 650 18px "SFMono-Regular", Consolas, monospace; letter-spacing: 0; }
      .num { font: 800 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
