<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Engineering Kit — 架构全景图</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-sans);
    background: var(--color-surface-page);
    color: var(--color-text-primary);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page { max-width: 880px; margin: 0 auto; padding: var(--space-48) var(--space-24) 64px; }

  /* ── Back button ── */
  .back-btn {
    position: fixed; top: var(--space-20); right: var(--space-20);
    width: 36px; height: 36px; border-radius: var(--radius-sm);
    border: 1px solid var(--color-border-default);
    background: var(--color-surface-panel);
    color: var(--color-text-secondary);
    font-size: var(--text-md); line-height: 1;
    cursor: pointer; display: grid; place-items: center;
    text-decoration: none; z-index: 10;
    transition: color var(--transition-fast), border-color var(--transition-fast);
  }
  .back-btn:hover { color: var(--color-text-primary); border-color: var(--gray-400); }

  /* ── Header ── */
  .header { text-align: center; margin-bottom: 40px; }
  .header-badge {
    display: inline-flex; align-items: center; gap: var(--space-6);
    padding: var(--space-4) var(--space-10); border-radius: var(--radius-xs);
    background: var(--color-surface-inverse); color: var(--color-text-inverse);
    font-size: var(--text-11); font-weight: var(--font-bold);
    letter-spacing: .06em; text-transform: uppercase;
    margin-bottom: var(--space-16);
  }
  .header-badge-dot { width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--color-success-icon); }
  .header h1 { font-size: var(--text-xl); font-weight: 800; letter-spacing: -.02em; margin-bottom: var(--space-6); text-wrap: balance; }
  .header p { font-size: var(--text-sm); color: var(--color-text-secondary); }
  .meta-line { font-size: var(--text-11); color: var(--color-text-muted); margin-top: var(--space-8); }

  /* ── Layer card ── */
  .layer {
    background: var(--color-surface-panel);
    border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-card);
    padding: var(--space-24);
    margin-bottom: var(--space-12);
  }

  .layer-head {
    display: flex; align-items: center; gap: var(--space-12);
    margin-bottom: var(--space-16);
    padding-bottom: var(--space-14);
    border-bottom: 1px solid var(--color-surface-control);
  }
  .layer-icon {
    width: var(--space-32); height: var(--space-32); border-radius: var(--radius-sm);
    display: grid; place-items: center;
    font-size: 15px; flex-shrink: 0;
  }
  .layer-meta { flex: 1; }
  .layer-tag {
    font-size: var(--text-10); font-weight: var(--font-semibold); letter-spacing: .04em;
    text-transform: uppercase; margin-bottom: 1px;
  }
  .layer-title { font-size: var(--text-base); font-weight: var(--font-bold); color: var(--color-text-primary); }
  .layer-count {
    font-size: var(--text-10); font-weight: var(--font-semibold); color: var(--color-text-muted);
    padding: var(--space-2) var(--space-8); border-radius: var(--radius-full);
    background: var(--color-surface-control);
  }

  /* Layer color variants */
  .layer-entry .layer-icon { background: var(--blue-50); color: var(--blue-600); }
  .layer-entry .layer-tag { color: var(--blue-600); }
  .layer-skill .layer-icon { background: #f5f3ff; color: var(--purple-600); }
  .layer-skill .layer-tag { color: var(--purple-600); }
  .layer-knowledge .layer-icon { background: var(--emerald-100); color: var(--emerald-600); }
  .layer-knowledge .layer-tag { color: var(--emerald-600); }
  .layer-governance .layer-icon { background: #fefce8; color: var(--yellow-600); }
  .layer-governance .layer-tag { color: var(--yellow-600); }

  /* ── Nodes grid ── */
  .nodes {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: var(--space-8);
  }
  .node {
    padding: var(--space-10) var(--space-12);
    border-radius: var(--radius-sm);
    border: 1px solid var(--color-border-subtle);
    background: var(--color-surface-page);
    transition: border-color var(--transition-fast), background var(--transition-fast);
  }
  .node:hover { border-color: var(--color-border-default); background: var(--color-surface-control); }
  .node-title { font-size: var(--text-xs); font-weight: var(--font-bold); color: var(--color-text-primary); margin-bottom: var(--space-2); }
  .node-desc { font-size: var(--text-10); color: var(--color-text-secondary); line-height: 1.4; }
  .node-meta { font-size: var(--text-10); color: var(--color-text-muted); line-height: 1.4; display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; word-break: break-all; }
  .node-badge { display: inline-block; padding: 0 var(--space-4); border-radius: var(--radius-xs); background: var(--color-surface-control); color: var(--color-text-secondary); font-size: 9px; font-weight: var(--font-semibold); text-transform: uppercase; letter-spacing: .03em; }
  .node-empty { font-size: var(--text-11); color: var(--color-text-muted); padding: var(--space-8); }
  .diagram-error { background: var(--color-surface-panel); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-card); padding: var(--space-24); font-size: var(--text-sm); color: var(--color-text-secondary); line-height: 1.6; }
  .diagram-error code { background: var(--color-surface-control); padding: var(--space-2) var(--space-6); border-radius: var(--radius-xs); font-family: var(--font-mono); font-size: var(--text-12); }

  .node.is-current {
    border-color: var(--emerald-200);
    background: var(--emerald-50);
  }
  .node.is-current .node-title::before {
    content: '';
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: var(--radius-full);
    background: var(--emerald-500);
    margin-right: 5px;
    vertical-align: middle;
    position: relative; top: -1px;
  }
  .node.is-stale {
    border-color: var(--orange-700);
    background: var(--orange-50);
  }
  .node.is-stale .node-title::before {
    content: '';
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: var(--radius-full);
    background: var(--orange-700);
    margin-right: 5px;
    vertical-align: middle;
    position: relative; top: -1px;
  }

  /* ── Connector ── */
  .connector { display: flex; justify-content: center; padding: var(--space-4) 0; }
  .connector-line { width: 1px; height: 20px; background: var(--color-border-default); }

  /* ── Legend ── */
  .legend {
    display: flex; gap: var(--space-20); justify-content: center;
    margin: var(--space-24) 0 var(--space-20);
    font-size: var(--text-11); color: var(--color-text-secondary);
  }
  .legend-item { display: flex; align-items: center; gap: var(--space-6); }
  .legend-dot { width: 8px; height: 8px; border-radius: var(--radius-full); }
  .legend-dot.current { background: var(--emerald-500); }
  .legend-dot.stale { background: var(--orange-700); }

  /* ── Goal footer ── */
  .goal {
    background: var(--color-surface-inverse);
    border-radius: var(--radius-card);
    padding: var(--space-28) var(--space-24);
    text-align: center;
  }
  .goal-title { font-size: var(--text-base); font-weight: var(--font-bold); color: var(--color-text-inverse); margin-bottom: var(--space-4); }
  .goal-desc { font-size: var(--text-xs); color: var(--color-text-muted); margin-bottom: var(--space-20); }
  .goal-phases { display: flex; gap: var(--space-8); justify-content: center; }
  .goal-phase {
    flex: 1; max-width: 200px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: var(--radius-sm);
    padding: var(--space-12) var(--space-14);
    text-align: center;
  }
  .goal-phase strong {
    display: block;
    font-size: var(--text-xs); font-weight: var(--font-bold); color: var(--color-text-inverse);
    margin-bottom: var(--space-2);
  }
  .goal-phase span { font-size: var(--text-10); color: var(--color-text-muted); }
  .goal-phase:first-child { border-color: rgba(52,211,153,.3); }
  .goal-phase:first-child strong { color: var(--color-success-icon); }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .page { padding: var(--space-32) var(--space-16) var(--space-48); }
    .header h1 { font-size: var(--text-lg); }
    .nodes { grid-template-columns: 1fr 1fr; }
    .goal-phases { flex-direction: column; align-items: center; }
    .goal-phase { max-width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<a href="../index.html" class="back-btn" title="返回主页">✕</a>

<div class="page">
  <div class="header">
    <div class="header-badge"><span class="header-badge-dot"></span> AI Engineering Kit</div>
    <h1>架构全景图</h1>
    <p>读取项目关系图谱实时渲染，永远反映当前代码结构</p>
    <p class="meta-line" id="metaLine"></p>
  </div>

  <div id="diagramRoot"></div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item"><div class="legend-dot current"></div> 已核实</div>
    <div class="legend-item"><div class="legend-dot stale"></div> 已过期（超 90 天未核实）</div>
  </div>

  <!-- Goal -->
  <div class="goal">
    <div class="goal-title">演进目标: AI 驱动的研发自动化系统</div>
    <div class="goal-desc">让 AI 看懂项目 → 让 AI 替你干活 → 让 AI 自主迭代</div>
    <div class="goal-phases">
      <div class="goal-phase"><strong>v3 知识结构化</strong><span>Source → Schema</span></div>
      <div class="goal-phase"><strong>v4 Skill 层</strong><span>标准化能力包</span></div>
      <div class="goal-phase"><strong>v5 治理闭环</strong><span>全流程自动化</span></div>
    </div>
  </div>
</div>

<script>
  const LAYERS = [
    { key: "entry",      cls: "layer-entry",      icon: "🔌", tag: "用户入口层 / Entry",       title: "多工具适配入口" },
    { key: "skills",     cls: "layer-skill",      icon: "⚡", tag: "研发能力层 / Skills",       title: "AI 可调用的专家技能" },
    { key: "knowledge",  cls: "layer-knowledge",  icon: "📚", tag: "知识与资产层 / Knowledge",  title: "项目知识的结构化管理" },
    { key: "governance", cls: "layer-governance", icon: "🛡️", tag: "基础治理层 / Governance",   title: "工程质量的底层保障" },
  ];

  // 排除镜像/软链接噪音：templates 是源文件副本，.ai/rules 是 docs 的 SSOT 软链接
  const EXCLUDE = /^(templates\/|\.ai\/rules\/|\.claude\/|\.agents\/)/;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }
  function basename(p) { return p.split("/").pop(); }

  function renderNode(n) {
    const stale = n.stale === true;
    const cls = stale ? "node is-stale" : "node is-current";
    const badge = n.docType ? `<span class="node-badge">${esc(n.docType)}</span>` : "";
    return `<div class="${cls}" title="${esc(n.id)}${stale ? " · 已过期" : ""}">
      <div class="node-title">${esc(basename(n.id))}</div>
      <div class="node-meta">${esc(n.id)}${badge}</div>
    </div>`;
  }

  function render(graph) {
    const meta = document.getElementById("metaLine");
    const gen = graph.generatedAt ? new Date(graph.generatedAt).toLocaleString("zh-CN") : "未知";
    meta.textContent = `共 ${graph.summary.nodeCount} 个文件节点 · ${graph.summary.edgeCount} 条关系 · 过期 ${graph.summary.staleCount} 个 · 生成于 ${gen}`;

    const root = document.getElementById("diagramRoot");
    const parts = [];
    LAYERS.forEach((layer, idx) => {
      const nodes = graph.nodes
        .filter(n => n.archLayer === layer.key && !EXCLUDE.test(n.id))
        .sort((a, b) => a.id.localeCompare(b.id));
      const staleN = nodes.filter(n => n.stale === true).length;
      const countLabel = staleN > 0 ? `${nodes.length} 项 · ${staleN} 过期` : `${nodes.length} 项`;
      parts.push(`
        <div class="layer ${layer.cls}">
          <div class="layer-head">
            <div class="layer-icon">${layer.icon}</div>
            <div class="layer-meta">
              <div class="layer-tag">${esc(layer.tag)}</div>
              <div class="layer-title">${esc(layer.title)}</div>
            </div>
            <span class="layer-count">${countLabel}</span>
          </div>
          <div class="nodes">${nodes.map(renderNode).join("") || '<div class="node-empty">暂无节点</div>'}</div>
        </div>`);
      if (idx < LAYERS.length - 1) parts.push('<div class="connector"><div class="connector-line"></div></div>');
    });
    root.innerHTML = parts.join("");
  }

  fetch("data/project-graph.json")
    .then(r => { if (!r.ok) throw new Error("not found"); return r.json(); })
    .then(render)
    .catch(() => {
      document.getElementById("diagramRoot").innerHTML =
        '<div class="diagram-error">读取关系图谱失败。请先在项目根目录运行：<code>bash scripts/build-project-graph.sh .</code> 生成 <code>docs/data/project-graph.json</code>，再刷新本页。</div>';
    });
</script>
</body>
</html>
