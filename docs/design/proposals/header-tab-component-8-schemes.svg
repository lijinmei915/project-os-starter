<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2060" viewBox="0 0 2400 2060">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .page { fill: #f6f8f8; }
      .title { font: 800 56px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171c1d; }
      .subtitle { font: 500 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667085; }
      .card { fill: #fff; stroke: #e5e7eb; stroke-width: 2; filter: url(#softShadow); }
      .card-title { font: 800 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171c1d; }
      .card-note { font: 500 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667085; }
      .brand { fill: #171c1d; }
      .brand-text { font: 800 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff; letter-spacing: 1.2px; }
      .mini-title { font: 800 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171c1d; }
      .mini-sub { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667085; }
      .tab-text { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tab-sub { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #6b7280; }
      .dark { fill: #171c1d; }
      .white { fill: #fff; }
      .green { fill: #22d3a6; }
      .line { stroke: #d9dee3; stroke-width: 2; }
      .thin { stroke: #e5e7eb; stroke-width: 1.5; }
      .strong { stroke: #171c1d; stroke-width: 2.5; }
      .pill { fill: #f8fafa; stroke: #e5e7eb; stroke-width: 1.5; }
      .selected { fill: #171c1d; }
      .selectedLight { fill: #fff; stroke: #171c1d; stroke-width: 2.5; }
      .hint { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #087f68; }
    </style>
  </defs>

  <rect class="page" width="2400" height="2060"/>
  <text x="96" y="104" class="title">Header Tab 组件 8 个方向</text>
  <text x="96" y="150" class="subtitle">基于当前截图：左侧保持产品身份，右侧承载“创建新项目 / 接手老项目”的一级 Tab。重点解决：未选中项也像可点击。</text>

  <!-- Card 1 -->
  <g transform="translate(96 210)">
    <rect class="card" rx="28" width="1080" height="400"/>
    <text x="36" y="52" class="card-title">01 轻量胶囊 Tab</text>
    <text x="36" y="84" class="card-note">最稳妥：轻外壳，不厚重，两个入口关系最清楚。</text>
    <g transform="translate(36 132)">
      <rect class="brand" x="0" y="0" rx="8" width="180" height="36"/>
      <text x="20" y="24" class="brand-text">AI ENGINEERING KIT</text>
      <text x="0" y="88" class="mini-title">AI 项目工程助手</text>
      <text x="0" y="120" class="mini-sub">选择新项目走初始化向导，老项目看体检报告。</text>
      <g transform="translate(610 38)">
        <rect x="0" y="0" rx="18" width="374" height="62" fill="#f3f5f5" stroke="#e3e7e8" stroke-width="1.5"/>
        <rect x="6" y="6" rx="14" width="178" height="50" class="selected"/>
        <text x="40" y="38" class="tab-text white">＋ 创建新项目</text>
        <text x="218" y="38" class="tab-text muted">↻ 接手老项目</text>
      </g>
    </g>
    <text x="36" y="356" class="hint">推荐场景：默认首版，清楚又不占戏。</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(1224 210)">
    <rect class="card" rx="28" width="1080" height="400"/>
    <text x="36" y="52" class="card-title">02 下划线 Tab</text>
    <text x="36" y="84" class="card-note">最像传统 tabs，轻，但需要加 hover 才不显得像普通文字。</text>
    <g transform="translate(36 132)">
      <rect class="brand" x="0" y="0" rx="8" width="180" height="36"/>
      <text x="20" y="24" class="brand-text">AI ENGINEERING KIT</text>
      <text x="0" y="88" class="mini-title">AI 项目工程助手</text>
      <text x="0" y="120" class="mini-sub">选择新项目走初始化向导，老项目看体检报告。</text>
      <g transform="translate(610 42)">
        <line x1="0" y1="54" x2="360" y2="54" class="line"/>
        <text x="30" y="34" class="tab-text dark">＋ 创建新项目</text>
        <line x1="24" y1="54" x2="166" y2="54" stroke="#171c1d" stroke-width="4" stroke-linecap="round"/>
        <text x="215" y="34" class="tab-text muted">↻ 接手老项目</text>
      </g>
    </g>
    <text x="36" y="356" class="hint">优点：极简。风险：未选中项静态可点击感偏弱。</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(96 660)">
    <rect class="card" rx="28" width="1080" height="400"/>
    <text x="36" y="52" class="card-title">03 单项描边 Tab</text>
    <text x="36" y="84" class="card-note">无外框，但每个 tab 都有边界，点击感强。</text>
    <g transform="translate(36 132)">
      <rect class="brand" x="0" y="0" rx="8" width="180" height="36"/>
      <text x="20" y="24" class="brand-text">AI ENGINEERING KIT</text>
      <text x="0" y="88" class="mini-title">AI 项目工程助手</text>
      <text x="0" y="120" class="mini-sub">选择新项目走初始化向导，老项目看体检报告。</text>
      <g transform="translate(590 34)">
        <rect x="0" y="0" rx="14" width="176" height="56" class="selected"/>
        <text x="28" y="36" class="tab-text white">＋ 创建新项目</text>
        <rect x="188" y="0" rx="14" width="176" height="56" class="pill"/>
        <text x="218" y="36" class="tab-text muted">↻ 接手老项目</text>
      </g>
    </g>
    <text x="36" y="356" class="hint">推荐场景：强调两个入口都可点，但关系感弱于胶囊。</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(1224 660)">
    <rect class="card" rx="28" width="1080" height="400"/>
    <text x="36" y="52" class="card-title">04 白底凸起 Tab</text>
    <text x="36" y="84" class="card-note">像浏览器页签，关系明确；比当前版本更干净。</text>
    <g transform="translate(36 132)">
      <rect class="brand" x="0" y="0" rx="8" width="180" height="36"/>
      <text x="20" y="24" class="brand-text">AI ENGINEERING KIT</text>
      <text x="0" y="88" class="mini-title">AI 项目工程助手</text>
      <text x="0" y="120" class="mini-sub">选择新项目走初始化向导，老项目看体检报告。</text>
      <g transform="translate(578 36)">
        <line x1="0" y1="58" x2="390" y2="58" class="line"/>
        <rect x="0" y="0" rx="14" width="188" height="58" fill="#fff" stroke="#171c1d" stroke-width="2"/>
        <line x1="18" y1="58" x2="170" y2="58" stroke="#171c1d" stroke-width="4"/>
        <text x="32" y="36" class="tab-text dark">＋ 创建新项目</text>
        <rect x="192" y="7" rx="12" width="178" height="50" fill="#f8fafa" stroke="#e5e7eb" stroke-width="1.5"/>
        <text x="220" y="39" class="tab-text muted">↻ 接手老项目</text>
      </g>
    </g>
    <text x="36" y="356" class="hint">推荐场景：如果你想保留“Tab”的直觉，这是强候选。</text>
  </g>

  <!-- Card 5 -->
  <g transform="translate(96 1110)">
    <rect class="card" rx="28" width="1080" height="400"/>
    <text x="36" y="52" class="card-title">05 双卡片 Tab</text>
    <text x="36" y="84" class="card-note">更像入口卡，适合第一次进入的人；占宽更多。</text>
    <g transform="translate(36 132)">
      <rect class="brand" x="0" y="0" rx="8" width="180" height="36"/>
      <text x="20" y="24" class="brand-text">AI ENGINEERING KIT</text>
      <text x="0" y="88" class="mini-title">AI 项目工程助手</text>
      <text x="0" y="120" class="mini-sub">选择新项目走初始化向导，老项目看体检报告。</text>
      <g transform="translate(545 18)">
        <rect x="0" y="0" rx="18" width="220" height="86" class="selectedLight"/>
        <text x="24" y="36" class="tab-text dark">＋ 创建新项目</text>
        <text x="24" y="62" class="tab-sub muted">从 0 开始搭骨架</text>
        <rect x="236" y="0" rx="18" width="220" height="86" class="pill"/>
        <text x="260" y="36" class="tab-text muted">↻ 接手老项目</text>
        <text x="260" y="62" class="tab-sub muted">先检查再补齐</text>
      </g>
    </g>
    <text x="36" y="356" class="hint">优点：最像“入口选择”。风险：Header 会更高更重。</text>
  </g>

  <!-- Card 6 -->
  <g transform="translate(1224 1110)">
    <rect class="card" rx="28" width="1080" height="400"/>
    <text x="36" y="52" class="card-title">06 浅底分段 Tab</text>
    <text x="36" y="84" class="card-note">比胶囊更克制，未选中也有明确按钮面积。</text>
    <g transform="translate(36 132)">
      <rect class="brand" x="0" y="0" rx="8" width="180" height="36"/>
      <text x="20" y="24" class="brand-text">AI ENGINEERING KIT</text>
      <text x="0" y="88" class="mini-title">AI 项目工程助手</text>
      <text x="0" y="120" class="mini-sub">选择新项目走初始化向导，老项目看体检报告。</text>
      <g transform="translate(590 34)">
        <rect x="0" y="0" rx="12" width="372" height="58" fill="#eef2f2"/>
        <rect x="4" y="4" rx="10" width="180" height="50" fill="#fff" stroke="#171c1d" stroke-width="2"/>
        <text x="28" y="36" class="tab-text dark">＋ 创建新项目</text>
        <text x="218" y="36" class="tab-text muted">↻ 接手老项目</text>
      </g>
    </g>
    <text x="36" y="356" class="hint">推荐场景：想要组件关系强，但不要黑色选中块。</text>
  </g>

  <!-- Card 7 -->
  <g transform="translate(96 1560)">
    <rect class="card" rx="28" width="1080" height="400"/>
    <text x="36" y="52" class="card-title">07 步骤入口 Tab</text>
    <text x="36" y="84" class="card-note">把“新建 / 接手”表达成两个路线，适合引导型产品。</text>
    <g transform="translate(36 132)">
      <rect class="brand" x="0" y="0" rx="8" width="180" height="36"/>
      <text x="20" y="24" class="brand-text">AI ENGINEERING KIT</text>
      <text x="0" y="88" class="mini-title">AI 项目工程助手</text>
      <text x="0" y="120" class="mini-sub">选择新项目走初始化向导，老项目看体检报告。</text>
      <g transform="translate(560 28)">
        <circle cx="24" cy="30" r="6" class="green"/>
        <line x1="30" y1="30" x2="196" y2="30" stroke="#d9dee3" stroke-width="2"/>
        <circle cx="202" cy="30" r="6" fill="#d1d5db"/>
        <rect x="0" y="58" rx="12" width="170" height="48" class="selected"/>
        <text x="25" y="89" class="tab-text white">创建新项目</text>
        <rect x="190" y="58" rx="12" width="170" height="48" class="pill"/>
        <text x="214" y="89" class="tab-text muted">接手老项目</text>
      </g>
    </g>
    <text x="36" y="356" class="hint">优点：流程感强。风险：像步骤条，不一定像 tab。</text>
  </g>

  <!-- Card 8 -->
  <g transform="translate(1224 1560)">
    <rect class="card" rx="28" width="1080" height="400"/>
    <text x="36" y="52" class="card-title">08 文字 + 强点击热区</text>
    <text x="36" y="84" class="card-note">最轻，但用 hover 热区和左侧指示条解决可点击性。</text>
    <g transform="translate(36 132)">
      <rect class="brand" x="0" y="0" rx="8" width="180" height="36"/>
      <text x="20" y="24" class="brand-text">AI ENGINEERING KIT</text>
      <text x="0" y="88" class="mini-title">AI 项目工程助手</text>
      <text x="0" y="120" class="mini-sub">选择新项目走初始化向导，老项目看体检报告。</text>
      <g transform="translate(612 30)">
        <rect x="0" y="0" rx="12" width="168" height="54" fill="#fff"/>
        <rect x="0" y="8" rx="2" width="4" height="38" fill="#171c1d"/>
        <text x="22" y="34" class="tab-text dark">创建新项目</text>
        <rect x="184" y="0" rx="12" width="168" height="54" fill="#f8fafa" stroke="#e5e7eb" stroke-width="1"/>
        <text x="207" y="34" class="tab-text muted">接手老项目</text>
      </g>
    </g>
    <text x="36" y="356" class="hint">优点：最轻。风险：关系感弱，需要动效和 hover 支撑。</text>
  </g>
</svg>
